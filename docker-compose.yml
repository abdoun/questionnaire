
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: questionnaire-app:latest
    container_name: questionnaire-app
    restart: unless-stopped

    ports:
      - "${APP_BIND_IP:-127.0.0.1}:8082:80"

    environment:
      APP_ENV: "${APP_ENV:-prod}"
      APP_DEBUG: "0"
      APP_SECRET: "${APP_SECRET}"

      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE}?serverVersion=8.4&charset=utf8mb4"

    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    container_name: questionnaire-db
    restart: unless-stopped

    ports:
      - "127.0.0.1:3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"

    volumes:
      - questionnaire_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  questionnaire_data:
